metric: otif
version: 3
status: current
owner: supply_chain_analytics
changed_by: data_governance
effective_from: 2026-09-01
grain: order_line
source: gold.fact_delivery
key: [order_no, line_no]
period: issue_date
dimensions: [plant, customer_no, item_no, product_group, order_type]
params:
  tolerance_weight: 0.02          # catch-weight items
inputs:
  on_time: "issue_date <= confirmed_delivery_date"
  in_full_count: "invoiced_qty >= ordered_qty"
  in_full_weight: "invoiced_weight_lb >= ordered_weight_lb * (1 - tolerance_weight)"
rules:
  in_full: "in_full_weight if catch_weight_flag else in_full_count"
  otif: "on_time and in_full"
aggregations:
  lines: "count(*)"
  otif_rate: "sum(otif) / count(*)"
  on_time_rate: "sum(on_time) / count(*)"
  in_full_rate: "sum(in_full) / count(*)"
notes: >-
  v3 switched catch-weight items from count to weight basis (2% tolerance). v2 used count for all items.
  On time is measured against the confirmed delivery date, all order types are in scope.
