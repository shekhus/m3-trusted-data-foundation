metric: otif_date_basis
version: 1
status: reference
owner: supply_chain_analytics
changed_by: data_governance
effective_from: 2026-09-15
grain: order_line
source: gold.fact_delivery
key: [order_no, line_no]
period: issue_date
dimensions: [plant, customer_no, item_no, product_group, order_type]
params:
  tolerance_weight: 0.02
inputs:
  on_time: "issue_date <= requested_date"
  in_full_count: "invoiced_qty >= ordered_qty"
  in_full_weight: "invoiced_weight_lb >= ordered_weight_lb * (1 - tolerance_weight)"
rules:
  in_full: "in_full_weight if catch_weight_flag else in_full_count"
  otif: "on_time and in_full"
aggregations:
  lines: "count(*)"
  otif_lines: "sum(otif)"
  otif_rate: "sum(otif) / count(*)"
notes: >-
  Reference only, never a report. Governed OTIF v3 with one switch: on time is measured against the date the
  customer requested instead of the confirmed delivery date. Used by reconciliation to size a tool's date-basis
  gap. The dashboard BI tool is documented to measure this way.
