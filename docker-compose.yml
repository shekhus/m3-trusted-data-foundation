# Local stack: Postgres + API + Streamlit portal (docs/decisions.md D-005, D-016).
# Values come from .env when present; the defaults below are local-only development credentials.

services:
  db:
    image: pgvector/pgvector:pg18  # Postgres 18 + pgvector for retrieval embeddings (D-027)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-m3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m3}
      POSTGRES_DB: ${POSTGRES_DB:-m3tdf}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-m3}:${POSTGRES_PASSWORD:-m3}@db:5432/${POSTGRES_DB:-m3tdf}
      API_KEYS: ${API_KEYS:-viewer:change-me-viewer,analyst:change-me-analyst,owner:change-me-owner}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-voyage}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyage-4}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      LLM_PRICE_IN_PER_MTOK: ${LLM_PRICE_IN_PER_MTOK:-0}
      LLM_PRICE_OUT_PER_MTOK: ${LLM_PRICE_OUT_PER_MTOK:-0}
      DATA_DIR: data
      SOURCE_SLA_HOURS: ${SOURCE_SLA_HOURS:-72}
    volumes:
      # generated extracts + masters, read-only (data/ is excluded from the image by .dockerignore)
      - ./data:/app/data:ro
      # uploaded extracts are the only thing the app writes under data/
      - ./data/uploads:/app/data/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  portal:
    build: .
    depends_on:
      app:
        condition: service_healthy
    command: ["sh", "scripts/start_portal.sh"]
    environment:
      API_BASE_URL: http://app:8000
    ports:
      - "8501:8501"

volumes:
  pgdata:
