[project]
name = "m3-trusted-data-foundation"
version = "0.1.0"
description = "Trusted data foundation for multi-plant supply-chain reporting (synthetic Infor M3-shaped data)."
requires-python = ">=3.12"
# Versions below were resolved from PyPI on 2026-09-14 (see docs/decisions.md D-002).
dependencies = [
    "pandas>=3.0.5",
    "numpy>=2.5.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.3.5",
    "streamlit>=1.63.0",
    "anthropic>=1.5.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.7", "mypy>=2.3.1", "types-PyYAML"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: needs Postgres; skipped when unreachable unless REQUIRE_POSTGRES=1 (D-009)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# long lines here are markdown table rows inside generated document text; wrapping changes the output
"synth/knowledge.py" = ["E501"]
"synth/generate.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["\\.venv", "data"]
